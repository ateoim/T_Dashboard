[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[functions.fitbit-fetch]
  schedule = "0 0 */13 * *"

[dev]
  framework = "#custom"
  functionsPort = 8888