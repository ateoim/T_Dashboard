[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

# Removed invalid redirect that starts with a reserved path
# [[redirects]]
#   from = "/.netlify/functions/*"
#   to = "/.netlify/functions/:splat"
#   status = 200

[functions.fitbit-fetch]
  schedule = "0 0 */13 * *"

[dev]
  framework = "#custom"
  functionsPort = 8888