<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tom's Music Stats</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <!-- Main Navigation -->
      <nav class="sidebar-nav">
        <a href="home.html" class="sidebar-link" id="home-link">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
        <a href="fitbit.html" class="sidebar-link" id="fitbit-link">
          <i class="fas fa-heartbeat"></i>
          <span>Fitbit</span>
        </a>
        <a href="spotify.html" class="sidebar-link active" id="spotify-link">
          <i class="fab fa-spotify"></i>
          <span>Spotify</span>
        </a>
      </nav>

      <!-- Social Links -->
      <div class="sidebar-social">
        <a
          href="https://x.com/greywizardtea"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fa-brands fa-x"></i>
          <span>Twitter</span>
        </a>
        <a
          href="https://www.instagram.com/grywzrd/"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fab fa-instagram"></i>
          <span>Instagram</span>
        </a>
        <a
          href="https://soundcloud.com/greywizardtea"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fab fa-soundcloud"></i>
          <span>SoundCloud</span>
        </a>
        <a
          href="https://github.com/yourusername"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fab fa-github"></i>
          <span>GitHub</span>
        </a>
      </div>
    </aside>

    <main class="container">
      <header class="page-header">
        <h1>Tom's Music Stats</h1>
        <p id="last-updated" class="update-timestamp">
          Last updated: Loading...
        </p>
      </header>

      <div class="stats-container">
        <!-- Now Playing (Full Width) -->
        <div class="stat-card now-playing-card">
          <div class="now-playing-content">
            <div class="album-art">
              <img id="now-playing-art" src="placeholder.jpg" alt="Album Art" />
              <button class="play-button" id="now-playing-button">
                <i class="fas fa-play"></i>
              </button>
            </div>
            <div class="track-info">
              <h3>Currently Playing</h3>
              <p id="now-playing" class="track-name">Loading...</p>
              <p id="now-playing-artist" class="artist-name"></p>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <!-- Top Track -->
          <div class="stat-card track-card">
            <div class="card-content">
              <div class="album-art">
                <img id="top-track-art" src="placeholder.jpg" alt="Album Art" />
                <button class="play-button">
                  <i class="fas fa-play"></i>
                </button>
              </div>
              <div class="track-info">
                <h3>Top Track This Week</h3>
                <p id="top-track" class="track-name">Loading...</p>
                <p id="top-track-artist" class="artist-name"></p>
              </div>
            </div>
          </div>

          <!-- Recently Played -->
          <div class="stat-card">
            <h3>Recently Played</h3>
            <div id="recent-tracks" class="track-list">
              <!-- Tracks will be inserted here -->
            </div>
          </div>

          <!-- Top Artists -->
          <div class="stat-card">
            <h3>Top Artists</h3>
            <div id="top-artists" class="artist-grid">
              <!-- Artists will be inserted here -->
            </div>
          </div>
        </div>

        <!-- Collaborative Playlist -->
        <div class="stat-card playlist-card">
          <div class="stat-icon">
            <i class="fas fa-music"></i>
          </div>
          <div class="stat-info">
            <h3>Tom's Playlist</h3>
            <div id="playlistViewer"></div>
            <div id="playlistInvite"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="spotify.js"></script>
  </body>
</html>
