<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tom's Dictionary</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .content {
        padding-top: 40px;
        padding-bottom: 70px;
      }

      #dictionary-content {
        font-family: "Roboto Mono", monospace;
        font-size: 10px;
        column-count: 6;
        column-gap: 10px;
        color: var(--spotify-green);
        margin-top: 20px;
        letter-spacing: 0.5px;
        height: calc(100vh - 200px);
        overflow: hidden;
      }

      .word {
        margin-bottom: 2px;
        opacity: 0;
        animation: fade-in 1.5s forwards;
        text-shadow: 0 0 5px rgba(29, 185, 84, 0.3);
      }

      #loading {
        text-align: center;
        font-family: "Inter", sans-serif;
        font-size: 24px;
        font-weight: 600;
        margin-top: 0;
        color: var(--spotify-green);
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(29, 185, 84, 0.4);
      }

      @keyframes fade-in {
        0% {
          opacity: 0;
          transform: translateY(10px);
        }
        100% {
          opacity: 0.8;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <!-- Main Navigation -->
      <nav class="sidebar-nav">
        <a href="home.html" class="sidebar-link active" id="home-link">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
        <a href="fitbit.html" class="sidebar-link" id="fitbit-link">
          <i class="fas fa-heartbeat"></i>
          <span>Fitbit</span>
        </a>
        <a href="index.html" class="sidebar-link" id="spotify-link">
          <i class="fab fa-spotify"></i>
          <span>Spotify</span>
        </a>
      </nav>

      <!-- Social Links -->
      <div class="sidebar-social">
        <a
          href="https://x.com/greywizardtea"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fa-brands fa-x"></i>
          <span>Twitter</span>
        </a>
        <a
          href="https://www.instagram.com/grywzrd/"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fab fa-instagram"></i>
          <span>Instagram</span>
        </a>
        <a
          href="https://soundcloud.com/greywizardtea"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fab fa-soundcloud"></i>
          <span>SoundCloud</span>
        </a>
        <a
          href="https://github.com/yourusername"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fab fa-github"></i>
          <span>GitHub</span>
        </a>
      </div>
    </aside>

    <div class="content">
      <div id="loading">DECODING...</div>
      <div id="dictionary-content"></div>
    </div>

    <script>
      const dictionaryContent = document.getElementById("dictionary-content");
      const loadingElement = document.getElementById("loading");

      async function fetchWords() {
        const response = await fetch(
          "https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt"
        );
        const text = await response.text();
        return text
          .split("\n")
          .filter((word) => word.trim() !== "")
          .sort();
      }

      async function displayWords() {
        const words = await fetchWords();
        const chunkSize = 5;
        let currentIndex = 0;

        const fragment = document.createDocumentFragment();

        async function addWords() {
          const chunk = words.slice(currentIndex, currentIndex + chunkSize);
          currentIndex = (currentIndex + chunkSize) % words.length;

          chunk.forEach((word) => {
            const div = document.createElement("div");
            div.className = "word";
            div.style.animationDelay = `${Math.random() * 0.2}s`;
            div.textContent = word;
            fragment.appendChild(div);
          });

          const fakeProgress = Math.random() * 20 + 80;
          loadingElement.textContent = `DECODING... ${fakeProgress.toFixed(
            1
          )}%`;

          dictionaryContent.appendChild(fragment.cloneNode(true));

          const oldWords = dictionaryContent.querySelectorAll(".word");
          if (oldWords.length > 1000) {
            for (let i = 0; i < chunkSize; i++) {
              oldWords[i].remove();
            }
          }

          await new Promise((resolve) => setTimeout(resolve, 800));
          await new Promise((resolve) => requestAnimationFrame(resolve));

          addWords();
        }

        addWords();
      }

      displayWords();
    </script>
  </body>
</html>
