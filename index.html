<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tom's Dashboard</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <!-- Main Navigation -->
      <nav class="sidebar-nav">
        <a href="home.html" class="sidebar-link" id="home-link">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
        <a href="fitbit.html" class="sidebar-link" id="fitbit-link">
          <i class="fas fa-heartbeat"></i>
          <span>Fitbit</span>
        </a>
        <a href="index.html" class="sidebar-link active" id="spotify-link">
          <i class="fab fa-spotify"></i>
          <span>Spotify</span>
        </a>
      </nav>

      <!-- Social Links -->
      <div class="sidebar-social">
        <a
          href="https://x.com/greywizardtea"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fa-brands fa-x"></i>
          <span>Twitter</span>
        </a>
        <a
          href="https://www.instagram.com/grywzrd/"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fab fa-instagram"></i>
          <span>Instagram</span>
        </a>
        <a
          href="https://soundcloud.com/greywizardtea"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fab fa-soundcloud"></i>
          <span>SoundCloud</span>
        </a>
        <a
          href="https://github.com/yourusername"
          class="sidebar-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fab fa-github"></i>
          <span>GitHub</span>
        </a>
      </div>
    </aside>

    <main class="container">
      <header class="page-header">
        <h1>Tom's Spotify Dashboard</h1>
        <button id="spotifyLoginBtn" class="spotify-login-btn">
          <i class="fab fa-spotify"></i>
          Connect to Spotify
        </button>
      </header>

      <!-- Dropdown Menu -->
      <div class="dropdown-section">
        <button class="dropdown-toggle" onclick="toggleDropdown()">
          <div class="toggle-content">
            <i class="fas fa-music"></i>
            <span>Music Stats</span>
          </div>
          <i class="fas fa-chevron-down"></i>
        </button>

        <div class="dropdown-content" id="statsDropdown">
          <div id="recentlyPlayed" class="stat-section">
            <div class="section-header">
              <h2><i class="fas fa-history"></i> Recently Played</h2>
            </div>
            <div class="card-grid" id="recentSongs"></div>
          </div>

          <div id="topArtists" class="stat-section">
            <div class="section-header">
              <h2><i class="fas fa-crown"></i> Most Listened To Artists</h2>
            </div>
            <div class="card-grid" id="topArtistsList"></div>
          </div>
        </div>
      </div>

      <!-- Content sections -->
      <div class="playlist-container">
        <div class="playlist-header">
          <h2><i class="fas fa-users"></i> Collaborative Spotify Playlist</h2>
        </div>

        <div class="playlist-content">
          <div class="search-container">
            <input
              type="text"
              id="songSearchInput"
              placeholder="Search for songs to add..."
              aria-label="Search songs"
            />
            <button id="songSearchButton" class="search-button">
              <i class="fas fa-search"></i> Search
            </button>
          </div>

          <div id="songSearchResults" class="search-results"></div>
          <div id="playlistViewer" class="playlist-frame"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <ul>
          <li>
            <a
              href="https://x.com/greywizardtea"
              target="_blank"
              rel="noopener noreferrer"
              title="Follow me on X"
            >
              <i class="fa-brands fa-x"></i>
            </a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/grywzrd/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fab fa-instagram"></i>
            </a>
          </li>
          <li>
            <a
              href="https://soundcloud.com/greywizardtea"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fab fa-soundcloud"></i>
            </a>
          </li>
        </ul>
      </div>
    </footer>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="spotify.js"></script>
  </body>
</html>
